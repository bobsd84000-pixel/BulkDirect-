<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TerraClass - Sentinel-2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#070c18;color:#e2e8f0}
.wrap{max-width:1200px;margin:0 auto;padding:1rem}
header{display:flex;align-items:center;justify-content:space-between;padding:.9rem 0;border-bottom:1px solid #1e293b;margin-bottom:1rem}
.logo{font-size:1.15rem;font-weight:700}.logo span{color:#4ade80}
.plan{font-size:.65rem;color:#4ade80;border:1px solid #166534;padding:.25rem .55rem;border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1rem}
.stat{background:#0d1526;border:1px solid #1e293b;border-radius:8px;padding:.7rem;text-align:center}
.stat b{display:block;font-size:1.3rem;color:#4ade80}
.stat span{font-size:.65rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em}
.filters{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.6rem;margin-bottom:1rem;-webkit-overflow-scrolling:touch}
.filters button{white-space:nowrap;background:#0d1526;border:1px solid #1e293b;color:#94a3b8;padding:.45rem .8rem;border-radius:99px;font-size:.75rem;cursor:pointer;font-family:inherit;transition:all .15s ease}
.filters button.on{background:#166534;border-color:#4ade80;color:#dcfce7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.7rem}
.card{background:#0d1526;border:1px solid #1e293b;border-radius:10px;overflow:hidden;opacity:0;transform:translateY(8px);animation:cardIn .22s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(var(--i,0)*25ms);transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(74,222,128,.25)}
body.filtered .card{opacity:1;transform:none;animation:none}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}
.card-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#1a2332}
.card-body{padding:.6rem}
.card h3{font-size:.8rem;color:#f1f5f9;margin-bottom:.2rem;font-weight:600}
.card p{font-size:.65rem;color:#94a3b8;line-height:1.3;margin-bottom:.35rem}
.bar{height:3px;background:#1e293b;border-radius:2px;overflow:hidden;margin-bottom:.25rem}
.bar i{display:block;height:100%;background:#4ade80}
.row{display:flex;justify-content:space-between;font-size:.6rem;color:#64748b;margin-bottom:.25rem}
.tag{font-size:.55rem;color:#86efac;background:rgba(74,222,128,.1);padding:.15rem .35rem;border-radius:2px;display:inline-block}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:.3rem;margin-top:.3rem;font-size:.5rem;color:#475569;line-height:1.2}
.meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer{text-align:center;font-size:.6rem;color:#475569;padding:1.5rem 0}
</style></head><body><div class="wrap">
<header><div class="logo">Terra<span>Class</span></div><div class="plan">v4.0 Canvas</div></header>
<div class="stats">
<div class="stat"><b id="n">0</b><span>Tiles</span></div>
<div class="stat"><b id="c">0</b><span>Classes</span></div>
<div class="stat"><b id="a">0%</b><span>Conf</span></div>
</div>
<div class="filters" id="f"></div>
<div class="grid" id="g"></div>
<footer>Sentinel-2 L2A • Canvas imagery • v4.0</footer>
</div>
<script>
const S=160;
function rnd(seed){let s=seed;return()=>{s=(s*1664525+1013904223)&0xffffffff;return (s>>>8)/16777216;};}
function noise(r,w,h,scale){
  const g=[],gw=Math.ceil(w/scale)+2,gh=Math.ceil(h/scale)+2;
  for(let i=0;i<gw*gh;i++)g.push(r());
  const out=new Float32Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const fx=x/scale,fy=y/scale,ix=Math.floor(fx),iy=Math.floor(fy);
    const tx=fx-ix,ty=fy-iy,sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);
    const a=g[iy*gw+ix],b=g[iy*gw+ix+1],c=g[(iy+1)*gw+ix],d=g[(iy+1)*gw+ix+1];
    out[y*w+x]=(a*(1-sx)+b*sx)*(1-sy)+(c*(1-sx)+d*sx)*sy;
  }
  return out;
}
function fbm(r,w,h,scales,weights){
  const out=new Float32Array(w*h);let tw=0;
  scales.forEach((s,i)=>{const n=noise(r,w,h,s),wt=weights[i];tw+=wt;for(let j=0;j<w*h;j++)out[j]+=n[j]*wt;});
  for(let j=0;j<w*h;j++)out[j]/=tw;
  return out;
}
function mkImage(type,seed){
  const c=document.createElement('canvas');c.width=S;c.height=S;
  const ctx=c.getContext('2d'),img=ctx.createImageData(S,S),p=img.data,r=rnd(seed);
  const base=fbm(r,S,S,[48,18,7,3],[1,.5,.25,.12]);
  const det=fbm(r,S,S,[5,2],[1,.6]);
  const put=(i,cr,cg,cb)=>{p[i*4]=Math.max(0,Math.min(255,cr));p[i*4+1]=Math.max(0,Math.min(255,cg));p[i*4+2]=Math.max(0,Math.min(255,cb));p[i*4+3]=255;};
  if(type==='Forest'){
    for(let i=0;i<S*S;i++){const v=base[i],d=det[i];
      const sh=(d-.5)*46;
      put(i, 24+v*30+sh*.7, 62+v*54+sh, 26+v*24+sh*.5);}
  } else if(type==='Water'){
    for(let i=0;i<S*S;i++){const v=base[i],d=det[i];
      const sh=(d-.5)*16;
      put(i, 10+v*22+sh, 34+v*44+sh, 68+v*62+sh*1.2);}
  } else if(type==='Urban'){
    for(let i=0;i<S*S;i++){const v=base[i];put(i, 92+v*40, 90+v*38, 86+v*36);}
    ctx.putImageData(img,0,0);
    for(let gy=0;gy<S;gy+=Math.floor(14+r()*10)){
      for(let gx=0;gx<S;gx+=Math.floor(12+r()*10)){
        const w=6+r()*12,h=6+r()*12,t=r();
        ctx.fillStyle=t<.3?`rgba(190,186,180,${.55+r()*.35})`:t<.6?`rgba(118,112,106,${.5+r()*.4})`:`rgba(148,80,62,${.45+r()*.35})`;
        ctx.fillRect(gx+r()*3,gy+r()*3,w,h);
      }
    }
    ctx.strokeStyle='rgba(58,56,54,.55)';ctx.lineWidth=2;
    for(let i=0;i<7;i++){const y=r()*S;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(S,y+(r()-.5)*8);ctx.stroke();
      const x=r()*S;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+(r()-.5)*8,S);ctx.stroke();}
    return c;
  } else if(type==='Agriculture'){
    for(let i=0;i<S*S;i++){const v=base[i];put(i, 104+v*46, 96+v*44, 56+v*30);}
    ctx.putImageData(img,0,0);
    const cols=[[126,142,58],[158,148,74],[96,118,52],[172,156,96],[110,132,62],[142,120,70]];
    let y=0;
    while(y<S){const hh=18+r()*30;let x=0;
      while(x<S){const ww=22+r()*38,col=cols[Math.floor(r()*cols.length)],a=.55+r()*.35;
        ctx.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},${a})`;
        ctx.fillRect(x,y,ww-1.5,hh-1.5);x+=ww;}
      y+=hh;}
    ctx.strokeStyle='rgba(78,68,44,.32)';ctx.lineWidth=1;
    for(let i=0;i<S;i+=10){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(S,i);ctx.stroke();}
    return c;
  } else {
    for(let i=0;i<S*S;i++){const v=base[i];put(i, 104+v*44, 102+v*42, 98+v*40);}
    ctx.putImageData(img,0,0);
    for(let i=0;i<14;i++){
      const w=26+r()*54,h=18+r()*40,x=r()*(S-w),y=r()*(S-h),t=r();
      ctx.fillStyle=t<.4?`rgba(206,204,198,${.6+r()*.3})`:t<.7?`rgba(126,130,134,${.6+r()*.3})`:`rgba(92,96,100,${.6+r()*.3})`;
      ctx.fillRect(x,y,w,h);
      ctx.fillStyle='rgba(50,50,52,.28)';ctx.fillRect(x+w,y+4,4,h);
    }
    ctx.strokeStyle='rgba(64,64,66,.5)';ctx.lineWidth=3;
    for(let i=0;i<4;i++){const y=r()*S;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(S,y+(r()-.5)*14);ctx.stroke();}
    return c;
  }
  ctx.putImageData(img,0,0);
  if(type==='Water'){
    ctx.strokeStyle='rgba(150,186,214,.22)';ctx.lineWidth=1.5;
    for(let i=0;i<5;i++){const y=r()*S;ctx.beginPath();ctx.moveTo(0,y);
      for(let x=0;x<S;x+=20)ctx.lineTo(x,y+Math.sin(x/22+i)*7);ctx.stroke();}
  }
  if(type==='Forest'){
    for(let i=0;i<260;i++){const x=r()*S,y=r()*S,rr=1+r()*2.4;
      ctx.fillStyle=`rgba(${18+r()*26},${76+r()*44},${28+r()*22},${.3+r()*.35})`;
      ctx.beginPath();ctx.arc(x,y,rr,0,6.28);ctx.fill();}
  }
  return c;
}

var D=[
 {id:'S2-001',titre:'Industrial Casablanca',desc:'Industrial class',classe:'Industrial',conf:82,ndvi:0.15,date:'2024-09-15',coords:'33.57N,7.59W',type:'Industrial',seed:11},
 {id:'S2-002',titre:'Manufacturing Paris',desc:'Industrial class',classe:'Industrial',conf:83,ndvi:0.12,date:'2024-09-14',coords:'48.86N,2.35E',type:'Industrial',seed:23},
 {id:'S2-003',titre:'Amazon Basin',desc:'Forest class',classe:'Forest',conf:91,ndvi:0.82,date:'2024-09-12',coords:'3.46S,62.21W',type:'Forest',seed:37},
 {id:'S2-004',titre:'Boreal Quebec',desc:'Forest class',classe:'Forest',conf:88,ndvi:0.76,date:'2024-09-11',coords:'48.42N,71.06W',type:'Forest',seed:41},
 {id:'S2-005',titre:'Congo Canopy',desc:'Forest class',classe:'Forest',conf:93,ndvi:0.85,date:'2024-09-10',coords:'0.52S,15.28E',type:'Forest',seed:53},
 {id:'S2-006',titre:'Lake Geneva',desc:'Water class',classe:'Water',conf:96,ndvi:0.08,date:'2024-09-13',coords:'46.45N,6.52E',type:'Water',seed:67},
 {id:'S2-007',titre:'Nile Delta',desc:'Water class',classe:'Water',conf:94,ndvi:0.14,date:'2024-09-09',coords:'31.24N,31.81E',type:'Water',seed:71},
 {id:'S2-008',titre:'Tokyo Bay',desc:'Urban class',classe:'Urban',conf:89,ndvi:0.19,date:'2024-09-14',coords:'35.62N,139.77E',type:'Urban',seed:83},
 {id:'S2-009',titre:'Sao Paulo Centro',desc:'Urban class',classe:'Urban',conf:87,ndvi:0.17,date:'2024-09-08',coords:'23.55S,46.63W',type:'Urban',seed:97},
 {id:'S2-010',titre:'Kansas Fields',desc:'Agriculture class',classe:'Agriculture',conf:92,ndvi:0.64,date:'2024-09-15',coords:'38.51N,98.32W',type:'Agriculture',seed:101},
 {id:'S2-011',titre:'Po Valley',desc:'Agriculture class',classe:'Agriculture',conf:90,ndvi:0.58,date:'2024-09-12',coords:'45.07N,10.42E',type:'Agriculture',seed:113},
 {id:'S2-012',titre:'Rotterdam Port',desc:'Industrial class',classe:'Industrial',conf:85,ndvi:0.11,date:'2024-09-13',coords:'51.92N,4.48E',type:'Industrial',seed:127}
];

var cur="Toutes";

function init(){
  var cls=["Toutes"];
  D.forEach(function(d){if(cls.indexOf(d.classe)<0)cls.push(d.classe)});
  var f=document.getElementById('f');
  cls.forEach(function(c){
    var b=document.createElement('button');
    b.textContent=c;
    if(c==="Toutes")b.className='on';
    b.onclick=function(){
      cur=c;
      document.body.classList.add('filtered');
      Array.prototype.forEach.call(f.children,function(x){x.className=''});
      b.className='on';
      render();
    };
    f.appendChild(b);
  });
  render();
}

function render(){
  var list = cur==="Toutes" ? D : D.filter(function(x){return x.classe===cur});
  var g=document.getElementById('g');
  g.innerHTML='';
  list.forEach(function(d,i){
    var el=document.createElement('div');
    el.className='card';
    el.style.setProperty('--i', i);
    var canvas=mkImage(d.type, d.seed);
    canvas.className='card-img';
    canvas.style.width='100%';
    canvas.style.height='auto';
    canvas.style.aspectRatio='1/1';
    canvas.style.objectFit='cover';
    canvas.style.display='block';
    el.appendChild(canvas);
    var body=document.createElement('div');
    body.className='card-body';
    var h3=document.createElement('h3');
    h3.textContent=d.titre;
    body.appendChild(h3);
    var p=document.createElement('p');
    p.textContent=d.desc;
    body.appendChild(p);
    var bar=document.createElement('div');
    bar.className='bar';
    var i_el=document.createElement('i');
    i_el.style.width=d.conf+'%';
    bar.appendChild(i_el);
    body.appendChild(bar);
    var row=document.createElement('div');
    row.className='row';
    var r1=document.createElement('span');
    r1.textContent=d.id;
    row.appendChild(r1);
    var r2=document.createElement('span');
    r2.textContent=d.conf+'%';
    row.appendChild(r2);
    body.appendChild(row);
    var tag=document.createElement('span');
    tag.className='tag';
    tag.textContent=d.classe;
    body.appendChild(tag);
    var meta=document.createElement('div');
    meta.className='meta';
    var s1=document.createElement('span');
    s1.textContent=d.coords;
    meta.appendChild(s1);
    var s2=document.createElement('span');
    s2.textContent=d.date;
    meta.appendChild(s2);
    var s3=document.createElement('span');
    s3.textContent='NDVI:'+(typeof d.ndvi==='number'?d.ndvi.toFixed(2):'N/A');
    meta.appendChild(s3);
    body.appendChild(meta);
    el.appendChild(body);
    g.appendChild(el);
  });
  document.getElementById('n').textContent=list.length;
  var cl={};
  list.forEach(function(d){cl[d.classe]=1});
  document.getElementById('c').textContent=Object.keys(cl).length;
  var s=list.reduce(function(a,b){return a+b.conf},0);
  document.getElementById('a').textContent=(list.length?Math.round(s/list.length):0)+'%';
}

init();
</script></body></html>
