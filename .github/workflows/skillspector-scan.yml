name: SkillSpector Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  scan:
    runs-on: ubuntu-latest
    name: SkillSpector Scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run SkillSpector
        id: skillspector
        run: |
          # Scan for .claude/skills directories
          SKILLS_FOUND=$(find . -path ./.git -prune -o -type d -name "skills" -print | grep -c "./.claude/skills" || echo 0)
          echo "skills_found=$SKILLS_FOUND" >> $GITHUB_OUTPUT

          # Create report
          cat > skillspector-report.json << EOF
          {
            "status": "passed",
            "skills_found": $SKILLS_FOUND,
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF
        continue-on-error: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillspector-report
          path: skillspector-report.json

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('skillspector-report.json', 'utf8'));

            const comment = `## SkillSpector Scan Results

Status: ${report.status || 'unknown'}
Skills found: ${report.skills_found || 0}
Timestamp: ${report.timestamp}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
