name: Scan Skills

on:
  pull_request:
    paths:
      - 'skills/**'
      - '.claude/**'
  push:
    branches:
      - main

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan skills directory
        run: |
          echo "🔍 Scanning skills directories..."

          SKILLS_COUNT=0
          CLAUDE_SKILLS_COUNT=0

          if [ -d "skills" ]; then
            SKILLS_COUNT=$(find skills -type f | wc -l)
            echo "✓ Found $SKILLS_COUNT files in /skills"
          fi

          if [ -d ".claude/skills" ]; then
            CLAUDE_SKILLS_COUNT=$(find .claude/skills -type f | wc -l)
            echo "✓ Found $CLAUDE_SKILLS_COUNT files in /.claude/skills"
          fi

          TOTAL=$((SKILLS_COUNT + CLAUDE_SKILLS_COUNT))
          echo ""
          echo "📊 Scan Summary:"
          echo "  Skills files: $TOTAL"
          echo ""

          if [ $TOTAL -eq 0 ]; then
            echo "⚠️  No skills found"
          else
            echo "✅ Scan complete - ready for review"
          fi
