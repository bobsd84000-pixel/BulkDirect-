<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TerraClass - Sentinel-2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#070c18;color:#e2e8f0}
.wrap{max-width:1200px;margin:0 auto;padding:1rem}
header{display:flex;align-items:center;justify-content:space-between;padding:.9rem 0;border-bottom:1px solid #1e293b;margin-bottom:1rem}
.logo{font-size:1.15rem;font-weight:700}.logo span{color:#4ade80}
.plan{font-size:.65rem;color:#4ade80;border:1px solid #166534;padding:.25rem .55rem;border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1rem}
.stat{background:#0d1526;border:1px solid #1e293b;border-radius:8px;padding:.7rem;text-align:center}
.stat b{display:block;font-size:1.3rem;color:#4ade80}
.stat span{font-size:.65rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em}
.filters{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.6rem;margin-bottom:1rem;-webkit-overflow-scrolling:touch}
.filters button{white-space:nowrap;background:#0d1526;border:1px solid #1e293b;color:#94a3b8;padding:.45rem .8rem;border-radius:99px;font-size:.75rem;cursor:pointer;font-family:inherit;transition:all .15s ease}
.filters button.on{background:#166534;border-color:#4ade80;color:#dcfce7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.7rem}
.card{background:#0d1526;border:1px solid #1e293b;border-radius:10px;overflow:hidden;opacity:0;transform:translateY(8px);animation:cardIn .22s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(var(--i,0)*25ms)}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(74,222,128,.25)}
body.filtered .card{opacity:1;transform:none;animation:none}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}
.card-img{width:100%;aspect-ratio:1/1;display:block;background:#1a2332;border-radius:4px}
.card-body{padding:.6rem}
.card h3{font-size:.8rem;color:#f1f5f9;margin-bottom:.2rem;font-weight:600}
.card p{font-size:.65rem;color:#94a3b8;line-height:1.3;margin-bottom:.35rem}
.bar{height:3px;background:#1e293b;border-radius:2px;overflow:hidden;margin-bottom:.25rem}
.bar i{display:block;height:100%;background:#4ade80}
.row{display:flex;justify-content:space-between;font-size:.6rem;color:#64748b;margin-bottom:.25rem}
.tag{font-size:.55rem;color:#86efac;background:rgba(74,222,128,.1);padding:.15rem .35rem;border-radius:2px;display:inline-block}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:.3rem;margin-top:.3rem;font-size:.5rem;color:#475569;line-height:1.2}
.meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer{text-align:center;font-size:.6rem;color:#475569;padding:1.5rem 0}
</style></head><body><div class="wrap">
<header><div class="logo">Terra<span>Class</span></div><div class="plan">v5.0 Simple</div></header>
<div class="stats">
<div class="stat"><b id="n">0</b><span>Tiles</span></div>
<div class="stat"><b id="c">0</b><span>Classes</span></div>
<div class="stat"><b id="a">0%</b><span>Conf</span></div>
</div>
<div class="filters" id="f"></div>
<div class="grid" id="g"></div>
<footer>Sentinel-2 L2A • Simplified Canvas • v5.0</footer>
</div>
<script>
function mkImage(type, seed) {
  const S = 160;
  const c = document.createElement('canvas');
  c.width = S;
  c.height = S;
  const ctx = c.getContext('2d');

  const colors = {
    'Forest': {bg: '#1a2332', fg: ['#2d5016', '#3d6b1f', '#4d8b2f']},
    'Water': {bg: '#1a2332', fg: ['#1e5a8e', '#2a7cb5', '#369edc']},
    'Urban': {bg: '#3a3a3a', fg: ['#505050', '#606060', '#707070']},
    'Agriculture': {bg: '#2a2a1a', fg: ['#6b8e23', '#8ba23d', '#a4b857']},
    'Industrial': {bg: '#2a2a2a', fg: ['#404040', '#505050', '#606060']}
  };

  const col = colors[type] || colors.Industrial;
  ctx.fillStyle = col.bg;
  ctx.fillRect(0, 0, S, S);

  // Simple pseudo-random pattern
  const rnd = seed;
  for(let i = 0; i < 20; i++) {
    const x = (rnd * 73 + i * 13) % S;
    const y = (rnd * 97 + i * 17) % S;
    const size = 10 + (rnd * 11 + i) % 30;
    const colorIdx = (rnd * 3 + i) % 3;
    ctx.fillStyle = col.fg[Math.floor(colorIdx)];
    ctx.fillRect(x, y, size, size);
  }

  return c;
}

var D = [
 {id:'S2-001',titre:'Industrial Casablanca',desc:'Industrial class',classe:'Industrial',conf:82,ndvi:0.15,date:'2024-09-15',coords:'33.57N,7.59W',type:'Industrial',seed:11},
 {id:'S2-002',titre:'Manufacturing Paris',desc:'Industrial class',classe:'Industrial',conf:83,ndvi:0.12,date:'2024-09-14',coords:'48.86N,2.35E',type:'Industrial',seed:23},
 {id:'S2-003',titre:'Amazon Basin',desc:'Forest class',classe:'Forest',conf:91,ndvi:0.82,date:'2024-09-12',coords:'3.46S,62.21W',type:'Forest',seed:37},
 {id:'S2-004',titre:'Boreal Quebec',desc:'Forest class',classe:'Forest',conf:88,ndvi:0.76,date:'2024-09-11',coords:'48.42N,71.06W',type:'Forest',seed:41},
 {id:'S2-005',titre:'Congo Canopy',desc:'Forest class',classe:'Forest',conf:93,ndvi:0.85,date:'2024-09-10',coords:'0.52S,15.28E',type:'Forest',seed:53},
 {id:'S2-006',titre:'Lake Geneva',desc:'Water class',classe:'Water',conf:96,ndvi:0.08,date:'2024-09-13',coords:'46.45N,6.52E',type:'Water',seed:67},
 {id:'S2-007',titre:'Nile Delta',desc:'Water class',classe:'Water',conf:94,ndvi:0.14,date:'2024-09-09',coords:'31.24N,31.81E',type:'Water',seed:71},
 {id:'S2-008',titre:'Tokyo Bay',desc:'Urban class',classe:'Urban',conf:89,ndvi:0.19,date:'2024-09-14',coords:'35.62N,139.77E',type:'Urban',seed:83},
 {id:'S2-009',titre:'Sao Paulo Centro',desc:'Urban class',classe:'Urban',conf:87,ndvi:0.17,date:'2024-09-08',coords:'23.55S,46.63W',type:'Urban',seed:97},
 {id:'S2-010',titre:'Kansas Fields',desc:'Agriculture class',classe:'Agriculture',conf:92,ndvi:0.64,date:'2024-09-15',coords:'38.51N,98.32W',type:'Agriculture',seed:101},
 {id:'S2-011',titre:'Po Valley',desc:'Agriculture class',classe:'Agriculture',conf:90,ndvi:0.58,date:'2024-09-12',coords:'45.07N,10.42E',type:'Agriculture',seed:113},
 {id:'S2-012',titre:'Rotterdam Port',desc:'Industrial class',classe:'Industrial',conf:85,ndvi:0.11,date:'2024-09-13',coords:'51.92N,4.48E',type:'Industrial',seed:127}
];

var cur = "Toutes";

function init() {
  var cls = ["Toutes"];
  D.forEach(d => {if(cls.indexOf(d.classe)<0)cls.push(d.classe)});
  var f = document.getElementById('f');
  cls.forEach(c => {
    var b = document.createElement('button');
    b.textContent = c;
    if(c === "Toutes")b.className = 'on';
    b.onclick = () => {
      cur = c;
      document.body.classList.add('filtered');
      Array.from(f.children).forEach(x => x.className = '');
      b.className = 'on';
      render();
    };
    f.appendChild(b);
  });
  render();
}

function render() {
  var list = cur === "Toutes" ? D : D.filter(x => x.classe === cur);
  var g = document.getElementById('g');
  g.innerHTML = '';
  list.forEach((d, i) => {
    var el = document.createElement('div');
    el.className = 'card';
    el.style.setProperty('--i', i);

    var canvas = mkImage(d.type, d.seed);
    canvas.className = 'card-img';
    el.appendChild(canvas);

    var body = document.createElement('div');
    body.className = 'card-body';

    var h3 = document.createElement('h3');
    h3.textContent = d.titre;
    body.appendChild(h3);

    var p = document.createElement('p');
    p.textContent = d.desc;
    body.appendChild(p);

    var bar = document.createElement('div');
    bar.className = 'bar';
    var i_el = document.createElement('i');
    i_el.style.width = d.conf + '%';
    bar.appendChild(i_el);
    body.appendChild(bar);

    var row = document.createElement('div');
    row.className = 'row';
    var r1 = document.createElement('span');
    r1.textContent = d.id;
    row.appendChild(r1);
    var r2 = document.createElement('span');
    r2.textContent = d.conf + '%';
    row.appendChild(r2);
    body.appendChild(row);

    var tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = d.classe;
    body.appendChild(tag);

    var meta = document.createElement('div');
    meta.className = 'meta';
    var s1 = document.createElement('span');
    s1.textContent = d.coords;
    meta.appendChild(s1);
    var s2 = document.createElement('span');
    s2.textContent = d.date;
    meta.appendChild(s2);
    var s3 = document.createElement('span');
    s3.textContent = 'NDVI:' + (typeof d.ndvi === 'number' ? d.ndvi.toFixed(2) : 'N/A');
    meta.appendChild(s3);
    body.appendChild(meta);

    el.appendChild(body);
    g.appendChild(el);
  });

  document.getElementById('n').textContent = list.length;
  var cl = {};
  list.forEach(d => cl[d.classe] = 1);
  document.getElementById('c').textContent = Object.keys(cl).length;
  var s = list.reduce((a, b) => a + b.conf, 0);
  document.getElementById('a').textContent = (list.length ? Math.round(s / list.length) : 0) + '%';
}

init();
</script></body></html>
