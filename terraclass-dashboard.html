var cur="Toutes";
function render(){
  var list = cur==="Toutes" ? D : D.filter(function(x){return x.classe===cur});
  var g=document.getElementById('g'); g.innerHTML='';
  list.forEach(function(d,i){
    var el=document.createElement('div'); el.className='card';
    el.style.setProperty('--i', i);
    var img='<img class="card-img" src="data:image/jpeg;base64,'+d.b64+'" alt="'+d.titre+'" loading="lazy" onerror="console.error(\'IMG FAIL:\',d.id)">';
    el.innerHTML=img+'<div class="card-body"><h3>'+d.titre+'</h3><p>'+d.desc+'</p><div class="bar"><i style="width:'+d.conf+'%"></i></div><div class="row"><span>'+d.id+'</span><span>'+d.conf+'%</span></div><span class="tag">'+d.classe+'</span><div class="meta"><span>'+d.coords+'</span><span>'+d.date+'</span><span>NDVI:'+d.ndvi.toFixed(2)+'</span></div></div>';
    g.appendChild(el);
  });
  document.getElementById('n').textContent=list.length;
  var cl={}; list.forEach(function(d){cl[d.classe]=1});
  document.getElementById('c').textContent=Object.keys(cl).length;
  var s=list.reduce(function(a,b){return a+b.conf},0);
  document.getElementById('a').textContent=(list.length?Math.round(s/list.length):0)+'%';
}
var cls=["Toutes"]; D.forEach(function(d){if(cls.indexOf(d.classe)<0)cls.push(d.classe)});
var f=document.getElementById('f');
cls.forEach(function(c){
  var b=document.createElement('button'); b.textContent=c;
  if(c==="Toutes")b.className='on';
  b.onclick=function(){cur=c;
    document.body.classList.add('filtered');
    Array.prototype.forEach.call(f.children,function(x){x.className=''});
    b.className='on'; render();
  };
  f.appendChild(b);
});
render();
</script></body></html>
