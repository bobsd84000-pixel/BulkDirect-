<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TerraClass - Sentinel-2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#070c18;color:#e2e8f0}
.wrap{max-width:1400px;margin:0 auto;padding:1rem}
header{display:flex;align-items:center;justify-content:space-between;padding:.9rem 0;border-bottom:1px solid #1e293b;margin-bottom:1rem}
.logo{font-size:1.15rem;font-weight:700}.logo span{color:#4ade80}
.plan{font-size:.65rem;color:#4ade80;border:1px solid #166534;padding:.25rem .55rem;border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin-bottom:1rem}
.stat{background:#0d1526;border:1px solid #1e293b;border-radius:8px;padding:.7rem;text-align:center}
.stat b{display:block;font-size:1.3rem;color:#4ade80}
.stat span{font-size:.65rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em}
.filters{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.6rem;margin-bottom:1rem;-webkit-overflow-scrolling:touch}
.filters button{white-space:nowrap;background:#0d1526;border:1px solid #1e293b;color:#94a3b8;padding:.45rem .8rem;border-radius:99px;font-size:.75rem;cursor:pointer;font-family:inherit;transition:all .15s ease}
.filters button.on{background:#166534;border-color:#4ade80;color:#dcfce7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.7rem}
.card{background:#0d1526;border:1px solid #1e293b;border-radius:10px;overflow:hidden;opacity:0;transform:translateY(8px);animation:cardIn .22s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(var(--i,0)*25ms);transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(74,222,128,.25)}
body.filtered .card{opacity:1;transform:none;animation:none}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}
.card-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#1a2332}
.card-body{padding:.6rem}
.card h3{font-size:.8rem;color:#f1f5f9;margin-bottom:.2rem;font-weight:600}
.card p{font-size:.65rem;color:#94a3b8;line-height:1.3;margin-bottom:.35rem}
.bar{height:3px;background:#1e293b;border-radius:2px;overflow:hidden;margin-bottom:.25rem}
.bar i{display:block;height:100%;background:#4ade80}
.row{display:flex;justify-content:space-between;font-size:.6rem;color:#64748b;margin-bottom:.25rem}
.tag{font-size:.55rem;color:#86efac;background:rgba(74,222,128,.1);padding:.15rem .35rem;border-radius:2px;display:inline-block}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:.3rem;margin-top:.3rem;font-size:.5rem;color:#475569;line-height:1.2}
.meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer{text-align:center;font-size:.6rem;color:#475569;padding:1.5rem 0}
</style></head><body><div class="wrap">
<header><div class="logo">Terra<span>Class</span></div><div class="plan">v3.0 Dashboard</div></header>
<div class="stats">
<div class="stat"><b id="n">0</b><span>Tiles</span></div>
<div class="stat"><b id="c">0</b><span>Classes</span></div>
<div class="stat"><b id="a">0%</b><span>Conf</span></div>
<div class="stat"><b id="ndvi">0</b><span>NDVI Moy</span></div>
</div>
<div class="filters"></div>
<div class="grid" id="grid"></div>
<footer>TerraClass Sentinel-2 L2A • Dashboard interactif de classification multi-classes</footer>
</div>
<script>
const genImg=(w,h,type)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');const cls={
'Forest':()=>{ctx.fillStyle='#1b4332';ctx.fillRect(0,0,w,h);for(let i=0;i<20;i++){ctx.fillStyle='#2d6a4f';ctx.fillRect(Math.random()*w,Math.random()*h,30,30);}},
'Water':()=>{ctx.fillStyle='#0d3b66';ctx.fillRect(0,0,w,h);ctx.fillStyle='#1a659e';for(let i=0;i<15;i++){ctx.fillRect(Math.random()*w,Math.random()*h,40,20);}},
'Urban':()=>{ctx.fillStyle='#3a3a3a';ctx.fillRect(0,0,w,h);for(let i=0;i<25;i++){ctx.fillStyle=Math.random()>.5?'#555':'#777';ctx.fillRect(i*20,0,20,h);}},
'Agriculture':()=>{ctx.fillStyle='#8b7e22';ctx.fillRect(0,0,w,h);ctx.fillStyle='#d4a574';for(let i=0;i<10;i++){ctx.fillRect(Math.random()*w,Math.random()*h,60,40);}},
'Industrial':()=>{ctx.fillStyle='#4a4a4a';ctx.fillRect(0,0,w,h);ctx.fillStyle='#888';for(let i=0;i<8;i++){ctx.fillRect(Math.random()*w,Math.random()*h,80,50);}},
};cls[type]?.();return c.toDataURL('image/png');};

const tiles=[
{id:'S2A_MSIL2A_20240315_001',titre:'Tiles Nordeste',desc:'Forêt tropicale primaire',classe:'Forest',conf:94,ndvi:.78,date:'2024-03-15',coords:['-3.2,-60.5'],img:genImg(256,256,'Forest')},
{id:'S2B_MSIL2A_20240318_002',titre:'Rio Negro',desc:'Cours d\'eau principal',classe:'Water',conf:98,ndvi:.45,date:'2024-03-18',coords:['-2.1,-65.3'],img:genImg(256,256,'Water')},
{id:'S2A_MSIL2A_20240320_003',titre:'Manaus',desc:'Zone urbaine dense',classe:'Urban',conf:96,ndvi:.32,date:'2024-03-20',coords:['-3.1,-60.0'],img:genImg(256,256,'Urban')},
{id:'S2B_MSIL2A_20240322_004',titre:'Cerrado',desc:'Savane tropicale',classe:'Agriculture',conf:89,ndvi:.52,date:'2024-03-22',coords:['-10.5,-55.5'],img:genImg(256,256,'Agriculture')},
{id:'S2A_MSIL2A_20240325_005',titre:'Zone Industrielle',desc:'Complexe manufact.',classe:'Industrial',conf:92,ndvi:.28,date:'2024-03-25',coords:['-2.9,-60.2'],img:genImg(256,256,'Industrial')},
{id:'S2B_MSIL2A_20240327_006',titre:'Mata Atlântica',desc:'Forêt atlantique',classe:'Forest',conf:91,ndvi:.82,date:'2024-03-27',coords:['-22.5,-48.1'],img:genImg(256,256,'Forest')},
{id:'S2A_MSIL2A_20240330_007',titre:'Pantanal',desc:'Zone humide',classe:'Water',conf:95,ndvi:.58,date:'2024-03-30',coords:['-17.2,-56.8'],img:genImg(256,256,'Water')},
{id:'S2B_MSIL2A_20240401_008',titre:'São Paulo',desc:'Métropole',classe:'Urban',conf:97,ndvi:.25,date:'2024-04-01',coords:['-23.5,-46.6'],img:genImg(256,256,'Urban')},
{id:'S2A_MSIL2A_20240405_009',titre:'Caatinga',desc:'Semi-aride',classe:'Agriculture',conf:87,ndvi:.35,date:'2024-04-05',coords:['-5.0,-38.0'],img:genImg(256,256,'Agriculture')},
{id:'S2B_MSIL2A_20240408_010',titre:'Porto Alegre',desc:'Zone côtière urbaine',classe:'Urban',conf:94,ndvi:.28,date:'2024-04-08',coords:['-30.0,-51.2'],img:genImg(256,256,'Urban')},
{id:'S2A_MSIL2A_20240410_011',titre:'Chapada Diamantina',desc:'Plateau forestier',classe:'Forest',conf:90,ndvi:.75,date:'2024-04-10',coords:['-12.9,-41.9'],img:genImg(256,256,'Forest')},
{id:'S2B_MSIL2A_20240412_012',titre:'Lac Sobradinho',desc:'Réservoir hydro',classe:'Water',conf:96,ndvi:.42,date:'2024-04-12',coords:['-9.7,-40.8'],img:genImg(256,256,'Water')},
{id:'S2A_MSIL2A_20240415_013',titre:'Distrito Industrial',desc:'Zone de production',classe:'Industrial',conf:93,ndvi:.22,date:'2024-04-15',coords:['-8.5,-35.2'],img:genImg(256,256,'Industrial')},
{id:'S2B_MSIL2A_20240417_014',titre:'Zona da Mata',desc:'Forêt côtière',classe:'Forest',conf:88,ndvi:.79,date:'2024-04-17',coords:['-7.2,-34.9'],img:genImg(256,256,'Forest')},
{id:'S2A_MSIL2A_20240420_015',titre:'Lagune Araruama',desc:'Lagon saumâtre',classe:'Water',conf:91,ndvi:.48,date:'2024-04-20',coords:['-22.8,-42.4'],img:genImg(256,256,'Water')},
];

const classes=['Forest','Water','Urban','Agriculture','Industrial'];let filter='';
const render=()=>{const f=document.querySelector('.grid');f.innerHTML='';const d=filter?tiles.filter(t=>t.classe===filter):tiles;d.forEach((t,i)=>{const c=document.createElement('div');c.className='card';c.style.setProperty('--i',i);c.innerHTML=`<img class="card-img" src="${t.img}" loading="lazy" alt="${t.titre}"><div class="card-body"><h3>${t.titre}</h3><p>${t.desc}</p><div class="bar"><i style="width:${t.conf}%"></i></div><div class="row"><span>Conf</span><b>${t.conf}%</b></div><div class="row"><span>NDVI</span><b>${t.ndvi.toFixed(2)}</b></div><div class="tag">${t.classe}</div><div class="meta"><span>📅${t.date}</span><span>🗺️${t.coords}</span><span>🛰️${t.id.slice(0,8)}</span></div></div>`;f.appendChild(c);});document.getElementById('n').textContent=d.length;const cls=new Set(d.map(t=>t.classe));document.getElementById('c').textContent=cls.size;const avg=(d.reduce((s,t)=>s+t.conf,0)/d.length||0).toFixed(0);document.getElementById('a').textContent=avg+'%';const ndvi=(d.reduce((s,t)=>s+t.ndvi,0)/d.length||0).toFixed(2);document.getElementById('ndvi').textContent=ndvi;document.body.classList.toggle('filtered',!!filter);};
classes.forEach(cl=>{const b=document.createElement('button');b.textContent=cl;b.onclick=()=>{filter=filter===cl?'':cl;b.classList.toggle('on');render();};document.querySelector('.filters').appendChild(b);});
render();
</script>
</body></html>
